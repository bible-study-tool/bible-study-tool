# GitLab CI — Bible Study Tool
#
# WHAT THIS IS (plain English):
# Every time someone proposes a change to this repo (a Merge Request), GitLab
# spins up a clean, throwaway machine and runs the commands below. If any
# command fails, the change is BLOCKED from being merged. This is the "robot
# gatekeeper" that enforces the data-integrity foundation (F1-F4 + the Strong's
# lexicon) so bad data can never silently reach the deterministic core.
#
# The philosophy: the checks we run here are the SAME commands a contributor
# runs locally. CI just automates them and makes them a hard gate.
#
# To run these exact checks locally:
#   python -m pytest                                   # all unit/integration tests
#   python -m search.validation.schema  --repo .       # F1 schema
#   python -m search.validation.strongs --repo .       # F2 Strong's
#   python -m search.validation.xrefs   --repo .       # F3 cross-refs
#   python -m search.validation.audit   --repo .       # F4 dead-reference audit

# A small, reproducible Python image. Dependencies come from pyproject.toml
# (installed below), not ad-hoc pip installs, so the declared deps are gated.
image: python:3.12-slim

stages:
  - test
  - validate
  - release

# Cache installed dependencies between runs so CI is fast.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Install the package in editable mode with its test extras. This exercises
# pyproject.toml (G5) and provides numpy/PyYAML/pytest to the jobs.
before_script:
  - pip install --quiet --upgrade pip
  - pip install --quiet -e '.[test]'

# ---- STAGE 1: unit & integration tests ----------------------------------
# `python -m pytest` auto-discovers every test_*.py under search/ (testpaths
# in pyproject.toml), so new test files — including the Strong's lexicon tests
# (test_lexicon.py) — are gated automatically without editing this file.
run-tests:
  stage: test
  script:
    - python -m pytest

# ---- STAGE 2: data-integrity gates ---------------------------------------
# Each validator exits non-zero on any ERROR, so a data problem fails the job
# and blocks the merge. Warnings (e.g. forward references) do NOT block.

validate-schema:
  stage: validate
  script:
    - python -m search.validation.schema --repo .
  # Depends on the whole repo including tags/taxonomy.json.

validate-strongs:
  stage: validate
  script:
    - python -m search.validation.strongs --repo .
  # Structural mode always runs; if lexicons/strongs-list.json is present the
  # full canonical-number check runs automatically.

validate-xrefs:
  stage: validate
  script:
    - python -m search.validation.xrefs --repo .
  # Forward references (to planned entries) are warnings; malformed targets are
  # errors and will fail here.

validate-audit:
  stage: validate
  script:
    - python -m search.validation.audit --repo .
  # Broader dead-reference audit over related[]/semantic_links/links files.

# ---- STAGE 3: standalone release build & publishing ---------------------
# Triggered on Git tags (e.g. v0.1.1-alpha) or web pipeline runs with RELEASE_BUILD=true.
# Builds zero-Python standalone distributions for Linux, Windows, and macOS, packages
# sidecar databases and lexicons, uploads immutable artifacts to the GitLab Generic
# Package Registry, and publishes the formal release on GitLab under Deployments > Releases.

build-standalone-linux:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_BUILD == "true"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git curl binutils && rm -rf /var/lib/apt/lists/*
    - python3 -m pip install --upgrade pip setuptools wheel
    - python3 -m pip install -e '.[test]'
    - python3 -m pip install pyinstaller
  script:
    - python3 scripts/build_release.py --skip-tests
  artifacts:
    name: "bible-study-${CI_COMMIT_TAG:-snapshot}-linux"
    paths:
      - dist/*.tar.gz
      - dist/*.tar.gz.sha256
      - dist/RELEASE_NOTES.md
      - dist/bible-study-*/SHA256SUMS
    expire_in: 30 days

build-standalone-windows:
  stage: release
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_BUILD == "true"
  allow_failure: true
  before_script:
    - python -m pip install --upgrade pip setuptools wheel
    - python -m pip install -e '.[test]'
    - python -m pip install pyinstaller
  script:
    - python scripts/build_release.py --skip-tests --zip
  artifacts:
    name: "bible-study-${CI_COMMIT_TAG:-snapshot}-windows"
    paths:
      - dist/*.zip
      - dist/*.zip.sha256
      - dist/bible-study-*/SHA256SUMS
    expire_in: 30 days

build-standalone-macos:
  stage: release
  tags:
    - macos
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_BUILD == "true"
  allow_failure: true
  before_script:
    - python3 -m pip install --upgrade pip setuptools wheel
    - python3 -m pip install -e '.[test]'
    - python3 -m pip install pyinstaller
  script:
    - python3 scripts/build_release.py --skip-tests
  artifacts:
    name: "bible-study-${CI_COMMIT_TAG:-snapshot}-macos"
    paths:
      - dist/*.tar.gz
      - dist/*.tar.gz.sha256
      - dist/bible-study-*/SHA256SUMS
    expire_in: 30 days

create-gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build-standalone-linux
      artifacts: true
    - job: build-standalone-windows
      artifacts: true
      optional: true
    - job: build-standalone-macos
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  before_script: []
  script:
    - echo "Publishing GitLab Release for $CI_COMMIT_TAG via glab CLI..."
    - |
      glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_HOST" || true
      glab release delete "$CI_COMMIT_TAG" -y || true
      set --
      for f in dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256; do
        [ -f "$f" ] && set -- "$@" "$f"
      done
      if [ "$#" -eq 0 ]; then
        echo "ERROR: No release distribution packages found in dist/." >&2
        exit 1
      fi
      glab release create "$CI_COMMIT_TAG" \
        --name "Release $CI_COMMIT_TAG" \
        --notes-file dist/RELEASE_NOTES.md \
        "$@" \
        --use-package-registry

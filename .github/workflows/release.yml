name: Release

# Multi-Platform Standalone & Desktop Release Pipeline (ADR-024, ADR-028, WP-038)
#
# Triggered on version tags (v*) or manual dispatch.
# Builds zero-Python standalone distributions AND native desktop installers (.dmg, .exe, .AppImage)
# for Linux (x86_64), Windows (x86_64), and macOS (arm64). Packages sidecar databases and
# cryptographic checksums, and publishes the formal release assets to GitHub Releases.

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.2-alpha)'
        required: false
        default: ''

permissions:
  contents: write

env:
  CI_COMMIT_TAG: ${{ inputs.version != '' && inputs.version || github.ref_name }}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-standalone:
    name: Build Standalone & Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            artifact-suffix: linux-x86_64
          - target: windows-x86_64
            os: windows-latest
            artifact-suffix: windows-x86_64
          - target: macos-arm64
            os: macos-latest
            artifact-suffix: macos-arm64

    steps:
      - name: Configure Git line endings and network settings
        run: |
          git config --global core.autocrlf false
          git config --global http.schannelCheckRevoke false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[test,dist]'

      - name: Build standalone package (Linux / macOS)
        if: runner.os != 'Windows'
        run: python scripts/build_release.py --skip-tests

      - name: Build standalone package (Windows)
        if: runner.os == 'Windows'
        run: python scripts/build_release.py --skip-tests --zip

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build native desktop application (Tauri)
        run: python scripts/build_desktop.py --skip-engine

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.artifact-suffix }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.exe
            dist/*.exe.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/RELEASE_NOTES.md
            dist/bible-study-*/SHA256SUMS
          if-no-files-found: ignore

  create-github-release:
    name: Publish GitHub Release
    needs: build-standalone
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: dist-downloads
          merge-multiple: true

      - name: Inspect and organize distribution packages
        run: |
          mkdir -p dist
          find dist-downloads -type f \( -name "*.tar.gz*" -o -name "*.zip*" -o -name "*.dmg*" -o -name "*.exe*" -o -name "*.msi*" -o -name "*.AppImage*" -o -name "*.deb*" -o -name "RELEASE_NOTES.md" \) -exec cp -v {} dist/ \;
          ls -la dist/
          pkg_count=$(ls -1 dist/*.tar.gz dist/*.zip dist/*.dmg dist/*.exe dist/*.msi dist/*.AppImage dist/*.deb 2>/dev/null | wc -l)
          if [ "$pkg_count" -eq 0 ]; then
            echo "ERROR: No standalone or desktop distribution packages found in dist/." >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && inputs.version || github.ref_name }}
          name: Release ${{ inputs.version != '' && inputs.version || github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.exe
            dist/*.exe.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.deb
            dist/*.deb.sha256
